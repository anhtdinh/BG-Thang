<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Báo giá thang máy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: 3 cột — danh sách bước (trái), nội dung bước (giữa), tóm tắt giá luôn hiện (phải). Điện thoại: xếp dọc. */
:root{
  --bg:#f3f4f5; --surface:#fff; --ink:#1b2328; --muted:#5d6a72; --line:#dde2e5;
  --accent:#0d6b6e; --accent-ink:#fff; --accent-soft:#dff0f0; --neg:#b3402a; --pos:#1b7a4b; --warn-bg:#fff4d6;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171a; --surface:#1b2227; --ink:#e8edef; --muted:#9aa8b0; --line:#2e383e;
  --accent:#4cc0c3; --accent-ink:#0b1a1b; --accent-soft:#16363a; --neg:#ff8d73; --pos:#5fd392; --warn-bg:#3a3316; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171a; --surface:#1b2227; --ink:#e8edef; --muted:#9aa8b0; --line:#2e383e;
  --accent:#4cc0c3; --accent-ink:#0b1a1b; --accent-soft:#16363a; --neg:#ff8d73; --pos:#5fd392; --warn-bg:#3a3316; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px 24px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13px}
.app{display:grid;grid-template-columns:200px minmax(0,1fr) 340px;gap:20px;align-items:start}
nav.steps{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px}
nav.steps button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:6px;color:var(--muted);font-weight:500}
nav.steps button:hover{background:var(--surface)}
nav.steps button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.steps button .n{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 12px var(--mono);flex:none}
nav.steps button.on{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
nav.steps button.on .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.steps button.done .n{border-color:var(--accent);color:var(--accent)}
main.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:22px;min-width:0}
main.panel h2{font-size:18px;margin:0 0 4px}
h4.sg{font-size:14px;margin:18px 0 6px;font-weight:600}
main.panel h3{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:26px 0 8px;font-weight:600}
.lead{color:var(--muted);margin:0 0 16px;max-width:65ch}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cards:has(>:nth-child(3):last-child){grid-template-columns:repeat(3,minmax(0,1fr))}
.cards:has(>:nth-child(3):last-child) .card{padding-left:10px;padding-right:10px}
.cards:has(>:nth-child(3):last-child) .card b,.cards:has(>:nth-child(3):last-child) .card .p{overflow-wrap:anywhere}
.card{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.card:hover{border-color:var(--muted)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.on{border-color:var(--accent);background:var(--accent-soft)}
.card b{font-weight:600}.card span{font-size:13px;color:var(--muted)}
.card .p{font:500 14px var(--mono);color:var(--ink);margin-top:4px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{all:unset;cursor:pointer;width:44px;height:44px;text-align:center;font-size:20px}
.stepper button:hover{background:var(--accent-soft)}
.stepper output{min-width:64px;text-align:center;font:600 20px var(--mono)}
dl.spec{margin:14px 0 0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
dl.spec .sr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 16px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:baseline}
dl.spec .sr:last-child{border-bottom:0}
dl.spec dt{color:var(--muted);font-size:13px}
dl.spec dd{margin:0;font-weight:600;font-size:14.5px;overflow-wrap:anywhere}
dl.spec dd small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
dl.spec .sr.price{background:var(--accent-soft)}
dl.spec .sr.price dd{font:600 20px var(--mono)}
@media (max-width:520px){dl.spec .sr{grid-template-columns:1fr}}
.note{background:var(--warn-bg);border-radius:6px;padding:9px 12px;font-size:13px;margin:12px 0}
.items{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.it{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.it:last-child{border-bottom:0}
.it:hover{background:var(--bg)}
.it.on{background:var(--accent-soft)}
.it input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.it .nm{min-width:0;font-size:14px}
.it .pr{font:500 13px var(--mono);white-space:nowrap;text-align:right}
.it .pr.neg{color:var(--neg)} .it .pr.pos{color:var(--pos)}
.it .un{color:var(--muted);font-size:12px;white-space:nowrap}
.qb{width:30px;height:30px;border-radius:8px;border:1px solid var(--border,#888);background:var(--surface,transparent);color:inherit;font-size:18px;line-height:1;cursor:pointer;padding:0}
.it .q input[type=number]{text-align:center;width:64px;-moz-appearance:textfield}
.it .q{grid-column:2 / -1;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
input[type=number],input[type=text],select{font:inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:7px 10px;min-height:38px;max-width:100%}
input[type=number]{width:84px;font-family:var(--mono)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input{width:100%;color:var(--ink)}
.nav2{display:flex;justify-content:space-between;gap:10px;margin-top:24px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:10px 18px;border-radius:8px;font-weight:600;border:1.5px solid var(--line);text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
aside.sum{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
aside.sum h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px}
.ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ln .v{font:500 12.5px var(--mono);text-align:right;white-space:nowrap}
.ln .v.neg{color:var(--neg)}
.ln small{color:var(--muted);grid-column:1/-1;font-size:12px}
.tot{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.tot .r{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.tot .r span:last-child{font-family:var(--mono)}
.tot .g{border-top:2px solid var(--ink);padding-top:8px;margin-top:4px;font-weight:700;font-size:16px}
.tot .g span:last-child{font-size:18px}
.sumbtns{display:flex;gap:8px;margin-top:12px}
.sumbtns .btn{flex:1;padding:9px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.r,th.r{text-align:right;font-family:var(--mono);white-space:nowrap}
td.neg{color:var(--neg)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
@media (max-width:1020px){
  .app{grid-template-columns:minmax(0,1fr)}
  nav.steps{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  nav.steps button{white-space:nowrap}
  nav.steps button.on{box-shadow:inset 0 -3px 0 var(--accent)}
  aside.sum{position:static}
}
@media (max-width:520px){main.panel{padding:16px}.it{grid-template-columns:22px minmax(0,1fr)}.it .pr,.it .un{grid-column:2;text-align:left}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

:root{color-scheme:light}
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
#print-area{display:none}
@media print{
 @page{size:A4;margin:14mm}

}

    txt(String(i+1),MX+14,y+34,F(23),MUT);
    nl.forEach((s,k)=>txt(s,MX+cNo+14,y+34+k*34,F(25,500),INK));

function buildPdf(imgs){
  const enc=new TextEncoder(),chunks=[],offs=[];let len=0;
  const push=b=>{if(typeof b==='string')b=enc.encode(b);chunks.push(b);len+=b.length};
  const obj=(id,fn)=>{offs[id]=len;push(id+' 0 obj\n');fn();push('\nendobj\n')};
  push('%PDF-1.4\n');push(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  const n=imgs.length;
  obj(1,()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2,()=>push('<< /Type /Pages /Kids ['+imgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+n+' >>'));
  imgs.forEach((j,i)=>{const pg=3+3*i,cs='q 595 0 0 842 0 0 cm /Im0 Do Q';
    obj(pg,()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 ${pg+2} 0 R >> >> /Contents ${pg+1} 0 R >>`));
    obj(pg+1,()=>push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(pg+2,()=>{push(`<< /Type /XObject /Subtype /Image /Width ${j.w} /Height ${j.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.data.length} >>\nstream\n`);push(j.data);push('\nendstream')})});
  const xref=len,total=3*n+3;
  push(`xref\n0 ${total}\n0000000000 65535 f \n`);
  for(let id=1;id<total;id++)push(String(offs[id]).padStart(10,'0')+' 00000 n \n');
  push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(chunks,{type:'application/pdf'});
}
async function exportPdf(){

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
  files.forEach(f=>{const nm=enc.encode(f.name),d=enc.encode(f.data),crc=crc32(d);
    const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0)]);
    parts.push(lh,nm,d);
    cen.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(d.length),...u32(d.length),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);
    off+=lh.length+nm.length+d.length});
  const cl=cen.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(cl),...u32(off),...u16(0)]);
  return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

   <label>Sản lượng cam kết cả năm (thang)<input type="number" id="f-annual" min="0" value="${S.annual}"></label>
   <label>Điều chỉnh giá bán thêm (%)<input type="number" id="f-mk" step="0.5" value="${S.markup}"></label>
  </div>
  <p class="sub" style="margin-top:8px">Chiết khấu thang nguyên chiếc theo sản lượng cam kết: 20–36 thang giảm 3 triệu, 37–59 giảm 4 triệu, 60–71 giảm 5 triệu, từ 72 giảm 6 triệu mỗi thang. Hiện áp dụng: <b>${c.tier?c.tier+' triệu/thang':'chưa đạt mức nào'}</b>.</p>
  <h3>Chi tiết hạng mục (mỗi thang)</h3>
  <div class="tbl"><table><thead><tr><th>Hạng mục</th><th class="r">Thành tiền</th></tr></thead><tbody>
   ${c.lines.map(l=>`<tr><td>${esc(l.n)}<br><small class="sub">${esc(l.s)}</small></td><td class="r ${l.v<0?'neg':''}">${sgn(l.v)}</td></tr>`).join('')}
   <tr><td><b>Giá mỗi thang</b></td><td class="r"><b>${fmt(c.per)}</b></td></tr></tbody></table></div>
  <h3>Điều kiện</h3>
  <ul class="sub" style="margin:0;padding-left:18px;max-width:70ch">
   <li>Giá đã gồm VAT, giao tại nhà máy VPTECH Hà Nam. Chưa gồm lắp đặt, vận hành, phí kiểm định, cấp phép và bảo trì.</li>
   <li>Bảo hành 12 tháng kể từ ngày giao hàng. Có bản vẽ lắp đặt và hồ sơ CO, CQ.</li>
   <li>Sản xuất và giao hàng nhanh nhất 15 ngày. Vật tư nhập khẩu hoặc phi tiêu chuẩn mất 30–45 ngày làm việc kể từ lần thanh toán đầu.</li>
   <li>Thanh toán 2 đợt: 40% khi ký, phần còn lại trong 7 ngày sau khi xuất kho.</li></ul>
  <h3>Xuất báo giá</h3>
  <div class="row"><button type="button" class="btn pri" id="dl-pdf"${DL?'':' hidden'}>Tải báo giá PDF</button><button type="button" class="btn" id="dl-xlsx"${DL?'':' hidden'}>Tải bảng Excel</button><button type="button" class="btn" id="dl-print">In báo giá</button></div>
  <div class="sub" id="dl-msg" role="status" style="margin-top:8px">${DL===null?'':'Bản PDF gồm thông tin khách hàng, cấu hình thang, chi tiết hạng mục và điều kiện, tải thẳng về máy.'}</div>`;
}

/* ---------- Tóm tắt ---------- */
function sumHtml(){
  const c=calc();
  return `<h2>Tóm tắt giá</h2>
  ${c.lines.map(l=>`<div class="ln"><span>${esc(l.n)}</span><span class="v ${l.v<0?'neg':''}">${sgn(l.v)}</span><small>${esc(l.s)}</small></div>`).join('')}
  <div class="tot">
   <div class="r"><span>Giá mỗi thang</span><span>${fmt(c.per)} đ</span></div>
   ${S.qty>1?`<div class="r"><span>× ${S.qty} thang</span><span>${fmt(c.gross)} đ</span></div>`:''}
   ${c.disc?`<div class="r"><span>Chiết khấu sản lượng (${c.tier} triệu × ${S.qty})</span><span>−${fmt(c.disc)} đ</span></div>`:''}
   ${S.markup?`<div class="r"><span>Điều chỉnh ${S.markup}%</span><span>${sgn(c.mk)} đ</span></div>`:''}
   <div class="r g"><span>Tổng</span><span>${fmt(c.total)} đ</span></div>
  </div>
  <div class="sumbtns"><button class="btn pri" type="button" id="save-q"${DB?'':' hidden'}>${S.qid?'Cập nhật báo giá':'Lưu báo giá'}</button><button class="btn" type="button" id="copy">Sao chép nội dung</button></div>
  ${S.qid?`<div class="ln" style="margin-top:10px"><span>Mã báo giá</span><span class="v" style="font-weight:600">${esc(S.qid)}</span><small><button class="btn" type="button" id="copy-id" style="padding:4px 10px;font-weight:500">Sao chép mã</button> <button class="btn" type="button" id="copy-code" style="padding:4px 10px;font-weight:500">Sao chép mã chia sẻ</button></small></div>`:''}
  <details class="syncbox" style="margin:10px 0"><summary style="cursor:pointer;font-weight:600">Đồng bộ Google Sheet${syncCfg().u?' (đã cài)':''}</summary>
    <div class="form" style="margin-top:8px"><label>Tên sale (tên tab trong Sheet)<input type="text" id="sync-sale" value="${esc(syncCfg().sale||'')}" placeholder="Ví dụ: Nguyen Van A"></label>
    <label>Mã cài đặt (do quản lý cung cấp)<input type="text" id="sync-code" value="" placeholder="${syncCfg().u?'Đã cài. Dán mã mới để thay.':'Dán mã bắt đầu bằng CFG1.'}" autocomplete="off"></label></div>
    <div class="row" style="margin-top:6px"><button class="btn" type="button" id="sync-save">Lưu cài đặt</button><button class="btn" type="button" id="sync-now">Gửi báo giá này lên Sheet</button></div>
    <div class="sub" id="sync-msg" role="status" style="margin-top:6px"></div>
    <details style="margin-top:8px"><summary style="cursor:pointer">Dành cho quản lý: tạo mã cài đặt</summary><div class="form" style="margin-top:6px"><label>Link Web app (Apps Script)<input type="text" id="gen-url" placeholder="https://script.google.com/macros/s/…/exec"></label><label>Mã truy cập (ACCESS_KEY)<input type="text" id="gen-key"></label></div><div class="row" style="margin-top:6px"><button class="btn" type="button" id="gen-btn">Tạo mã cài đặt</button></div><textarea id="gen-out" readonly rows="3" style="width:100%;margin-top:6px" placeholder="Mã cài đặt sẽ hiện ở đây, gửi cho sale"></textarea></details></details>
  <div class="sub" id="q-msg" style="margin-top:6px" role="status"></div>
  <div class="sub" id="copied" style="margin-top:6px" role="status"></div>`;
}
function quoteText(){
  const c=calc();const L=[];
  L.push('BÁO GIÁ THANG MÁY – VPTECH HÀ NAM (giá 2026, đã gồm VAT, giao tại nhà máy)');if(S.qid)L.push('Mã báo giá: '+S.qid);
  if(S.cust.name)L.push('Khách hàng: '+S.cust.name);if(S.cust.proj)L.push('Công trình: '+S.cust.proj);if(S.cust.contact)L.push('Liên hệ: '+S.cust.contact);
  L.push('');c.lines.forEach((l,i)=>L.push(`${i+1}. ${l.n} (${l.s}): ${sgn(l.v)} đ`));
  L.push('');L.push('Giá mỗi thang: '+fmt(c.per)+' đ');
  if(S.qty>1)L.push(`Số lượng: ${S.qty} thang = ${fmt(c.gross)} đ`);
  if(c.disc)L.push('Chiết khấu sản lượng: −'+fmt(c.disc)+' đ');
  if(S.markup)L.push(`Điều chỉnh ${S.markup}%: ${sgn(c.mk)} đ`);
  L.push('TỔNG: '+fmt(c.total)+' đ');
  L.push('');L.push('Thanh toán: 40% khi ký, phần còn lại trong 7 ngày sau khi xuất kho. Giao hàng nhanh nhất 15 ngày. Bảo hành 12 tháng.');
  return L.join('\n');
}

/* ---------- Vẽ lại ---------- */
function renderNav(){$('#nav').innerHTML=STEPS.map((s,i)=>`<button type="button" data-step="${i}" class="${i===S.step?'on':i<S.step?'done':''}"><span class="n">${i+1}</span>${s}</button>`).join('')}
function renderMain(){
  $('#main').innerHTML=stepHtml(S.step)+`<div class="nav2">${S.step>0?'<button type="button" class="btn" data-act="prev">Quay lại</button>':'<span></span>'}${S.step<STEPS.length-1?'<button type="button" class="btn pri" data-act="next">Tiếp tục: '+STEPS[S.step+1]+'</button>':''}</div>`;
}
function renderSum(){$('#sum').innerHTML=sumHtml()}
function render(){normalize();renderNav();renderMain();renderSum();save()}

document.addEventListener('click',e=>{
  const qs=e.target.closest('[data-qstep]');if(qs){e.preventDefault();const id=qs.dataset.qstep;S.sel[id]=Math.max(1,(S.sel[id]||1)+ +qs.dataset.d);const y=window.scrollY;renderMain();renderSum();save();window.scrollTo(0,y);return}
  const st=e.target.closest('[data-step]');if(st){S.step=+st.dataset.step;render();window.scrollTo({top:0});return}
  const b=e.target.closest('[data-act]');
  if(b){const a=b.dataset.act,v=b.dataset.v;
    if(a==='type'){S.type=v;S.sel={};S.cabKind='normal';S.doorGlass=false;S.vgG='';S.vgM='';S.doorKind='';S.cabMode='zone';S.brand=null;S.load=null;S.speed=null;S.door=null}
    else if(a==='stops'){S.stops=Math.max(2,Math.min(9,S.stops+ +v));for(const id in S.sel){const it=byId[id];if(defQty(it)!==1&&(it.unit==='Stop'||it.cat==='baoche'||it.cat==='cua'||/^Butong tầng/.test(it.name)))S.sel[id]=defQty(it)}}
    else if(a==='dkind')S.doorKind=v;
    else if(a==='inox'){S.inox=v;S.inox1=false}
    else if(a==='doorkind'){S.doorGlass=v==='glass';ITEMS.filter(i=>i.cat==='cua').forEach(i=>delete S.sel[i.id])}
    else if(a==='glassn'){S.glassN=+v}
    else if(a==='glassf'){S.glassF=v}
    else if(a==='cuaday'){delete S.sel.cua73;delete S.sel.cua74;if(v)S.sel[v]=1}
    else if(a==='cabkind'){S.cabKind=v;if(v!=='glass')ITEMS.filter(i=>i.cat==='cua'&&/kính cường lực/.test(i.name)).forEach(i=>delete S.sel[i.id]);['combo','vlon','vgoc1','vgoc2','vgoc3','vkinh','vday','doitrong'].forEach(c=>ITEMS.filter(i=>i.cat===c).forEach(i=>delete S.sel[i.id]));S.vgG='';S.vgM=''}
    else if(a==='load')S.load=+v;
    else if(a==='speed'){S.speed=+v}
    else if(a==='door')S.door=+v;
    else if(a==='next'){S.step=Math.min(STEPS.length-1,S.step+1);render();window.scrollTo({top:0});return}
    else if(a==='prev'){S.step=Math.max(0,S.step-1);render();window.scrollTo({top:0});return}
    render();return}
  if(e.target.id==='save-q'){saveQuote();return}
  if(e.target.id==='open-btn'){openQuote();return}
  if(e.target.id==='copy-code'){copyText(shareCode(),$('#q-msg'),'Đã sao chép mã chia sẻ. Gửi mã này cho người khác, họ dán vào ô "Nhập mã" để mở lại báo giá.');return}
  if(e.target.id==='copy-id'){copyText(S.qid,$('#q-msg'),'Đã sao chép mã '+S.qid+'.');return}
  if(e.target.id==='dl-pdf'){exportPdf();return}
  if(e.target.id==='dl-print'){exportPrint();return}
  if(e.target.id==='gen-btn'){const u=$('#gen-url').value.trim(),k=$('#gen-key').value.trim();$('#gen-out').value=(u&&k)?'CFG1.'+b64e(JSON.stringify({u,k})):'Nhập đủ link và mã truy cập.';return}
  if(e.target.id==='sync-save'){const m=$('#sync-msg'),cfg=syncCfg(),sale=$('#sync-sale').value.trim(),code=$('#sync-code').value.trim();
    if(code){const o=decodeSetup(code);if(!o){m.textContent='Mã cài đặt không hợp lệ.';return}cfg.u=o.u;cfg.k=o.k}
    if(!cfg.u){m.textContent='Chưa có mã cài đặt.';return}
    if(!sale){m.textContent='Nhập tên sale.';return}
    cfg.sale=sale;syncCfgSave(cfg);m.textContent='Đã lưu cài đặt. Từ nay mỗi lần bấm Lưu báo giá sẽ tự gửi lên Sheet.';syncFlush();return}
  if(e.target.id==='sync-now'){const m=$('#sync-msg');if(!syncCfg().u){m.textContent='Hãy lưu cài đặt trước.';return}
    saveQuote();if(S.qid)syncSend(S.qid,m);return}
  if(e.target.id==='dl-xlsx'){exportXlsx();return}
  if(e.target.id==='reset'){S=JSON.parse(JSON.stringify(DEF));render();return}
  if(e.target.id==='copy'){const t=quoteText(),m=$('#copied');
    const ok=()=>{m.textContent='Đã sao chép báo giá.'};
    const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')?ok():m.textContent='Không sao chép được, hãy chọn và copy thủ công.'}catch(_){m.textContent='Không sao chép được.'}ta.remove()};
    try{navigator.clipboard.writeText(t).then(ok,fb)}catch(_){fb()}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ck){S.cabKind=t.dataset.ck;if(S.cabKind!=='glass')ITEMS.filter(i=>i.cat==='cua'&&/kính cường lực/.test(i.name)).forEach(i=>delete S.sel[i.id]);['combo','vlon','vgoc1','vgoc2','vgoc3','vkinh','vday','doitrong'].forEach(c=>ITEMS.filter(i=>i.cat===c).forEach(i=>delete S.sel[i.id]));S.vgG='';S.vgM='';const y=window.scrollY;renderMain();renderSum();save();window.scrollTo(0,y);return}
  if(t.dataset.cab){const m=t.dataset.cab;
    if(m==='combo'){['vlon','vgoc1','vgoc2','vgoc3','vkinh','vday','trangia','tayvin','mathang','opdong'].forEach(c=>ITEMS.filter(i=>i.cat===c).forEach(i=>delete S.sel[i.id]));butCab().forEach(i=>delete S.sel[i.id]);S.vgG='';S.vgM=''}
    else ITEMS.filter(i=>i.cat==='combo').forEach(i=>delete S.sel[i.id]);
    S.cabMode=m;const y=window.scrollY;renderMain();renderSum();save();window.scrollTo(0,y);return}
  if(t.dataset.dk!==undefined){S.doorKind=t.dataset.dk;const y=window.scrollY;renderMain();renderSum();save();window.scrollTo(0,y);return}
  if(t.dataset.vg){if(t.dataset.vg==='g'){S.vgG=t.value;const ms=S.vgG?vgMids(S.vgG):[];if(!ms.includes(S.vgM))S.vgM=ms.length===1?ms[0]:''}else S.vgM=t.value;
    vgApply();const y=window.scrollY;renderMain();renderSum();save();window.scrollTo(0,y);return}
  if(t.dataset.single){const ids=ITEMS.filter(i=>GROUPS[t.dataset.single].includes(i.cat)).map(i=>i.id);
    ids.forEach(id=>delete S.sel[id]);if(t.value)S.sel[t.value]=1;
    if(t.dataset.single==='mk'){const tu=ITEMS.find(i=>i.cat==='tudieu');
      if(t.value&&byId[t.value].pack){delete S.sel[tu.id];S.autoTu=false}
      else if(t.value){S.sel[tu.id]=1;S.autoTu=true}
      else if(S.autoTu){delete S.sel[tu.id];S.autoTu=false}}
    if(t.dataset.single==='td'){S.autoTu=false;if(t.value)ITEMS.filter(i=>i.pack).forEach(i=>delete S.sel[i.id])}const y=window.scrollY;renderMain();renderSum();save();window.scrollTo(0,y);return}
  if(t.dataset.id){if(t.checked)S.sel[t.dataset.id]=defQty(byId[t.dataset.id]);else delete S.sel[t.dataset.id];
    const y=window.scrollY;renderMain();renderSum();save();window.scrollTo(0,y);return}
  if(t.dataset.qty){S.sel[t.dataset.qty]=Math.max(1,Math.round(+t.value||1));renderSum();save();return}
  if(t.dataset.flag){S[t.dataset.flag]=t.checked;const y=window.scrollY;renderMain();renderSum();save();window.scrollTo(0,y);return}
  if(t.dataset.san){S.san=t.dataset.san;const y=window.scrollY;renderMain();renderSum();save();window.scrollTo(0,y)}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='open-id')openQuote()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q-vach'){const q=t.value.trim().toLowerCase();document.querySelectorAll('#vach-wrap .it[data-name]').forEach(r=>{r.hidden=!!q&&!r.dataset.name.includes(q)});return}
  const m={'c-name':['cust','name'],'c-proj':['cust','proj'],'c-contact':['cust','contact']}[t.id];
  if(m){S.cust[m[1]]=t.value;save();return}
  if(t.id==='f-qty'){S.qty=Math.max(1,Math.round(+t.value||1));renderSum();save()}
  if(t.id==='f-annual'){S.annual=Math.max(0,Math.round(+t.value||0));renderSum();save()}
  if(t.id==='f-mk'){S.markup=+t.value||0;renderSum();save()}
});
render();refreshList();syncFlush();
</script>
<div id="print-area" aria-hidden="true"></div>
</body></html>
